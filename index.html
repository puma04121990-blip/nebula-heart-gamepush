<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#070b16" />
  <title>Nebula Heart</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="boot">
    <div class="boot-mark" aria-hidden="true"></div>
    <h1 data-i18n="title">Сердце Туманности</h1>
    <p data-i18n="boot">Настройка ядра…</p>
    <div class="boot-bar"><i id="bootFill"></i></div>
  </div>

  <div id="app" class="hidden">
    <header class="top">
      <div class="stat">
        <span class="label" data-i18n="dust">Звёздная пыль</span>
        <strong id="dust">0</strong>
      </div>
      <div class="stat">
        <span class="label" data-i18n="flow">Поток</span>
        <strong id="rate">0 / сек</strong>
      </div>
      <button id="btnMenu" class="icon-btn" type="button" data-i18n-aria="menu" aria-label="Меню">☰</button>
    </header>

    <section class="stage">
      <div class="stage-meta">
        <div id="formName">Искра пустоты</div>
        <div id="tideChip" class="chip">Штиль</div>
        <div class="evo-row">
          <span id="evoLabel">Фаза 0%</span>
          <div class="evo-bar"><i id="evoFill"></i></div>
        </div>
      </div>

      <button id="core" type="button" data-i18n-aria="tuneCore" aria-label="Настроить ядро">
        <span class="halo"></span>
        <span class="core-body" id="coreBody"></span>
        <span class="ring r1"></span>
        <span class="ring r2"></span>
      </button>
      <div id="combo" class="combo hidden">резонанс ×1</div>
      <div id="floatLayer" class="floats"></div>
    </section>

    <nav class="dock">
      <button id="btnShop" type="button" data-i18n="orbits">Орбиты</button>
      <button id="btnCollapse" type="button" data-i18n="collapse">Коллапс</button>
      <button id="btnReward" type="button" data-i18n="reward">Квант пыли</button>
    </nav>
  </div>

  <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true">
    <div class="sheet-card">
      <div class="sheet-head">
        <h2 id="sheetTitle">Орбиты</h2>
        <button id="sheetClose" type="button" data-i18n="close">Закрыть</button>
      </div>
      <div id="sheetBody" class="sheet-body"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script>
    window.GP_PROJECT_ID = 'YOUR_PROJECT_ID';
    window.GP_PUBLIC_TOKEN = 'YOUR_PUBLIC_TOKEN';
  </script>
  <script src="js/i18n.js"></script>
  <script src="js/gp-bridge.js"></script>
  <script src="js/game.js"></script>
  <script>
    (function loadGP() {
      var id = window.GP_PROJECT_ID;
      var token = window.GP_PUBLIC_TOKEN;
      if (!id || id === 'YOUR_PROJECT_ID') return;
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://gamepush.com/sdk/game-score.js?projectId=' +
        encodeURIComponent(id) + '&publicToken=' + encodeURIComponent(token) +
        '&callback=onGPInit';
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
