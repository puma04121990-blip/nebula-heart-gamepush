<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#080d1d" />
  <meta name="description" content="Атлас Эха — интерактивная игра-наблюдение о живом ночном небе, созвездиях и личных историях." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Атлас Эха</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="boot" aria-live="polite">
    <div class="boot-astrolabe" aria-hidden="true"><i></i><b></b></div>
    <h1 data-i18n="title">Атлас Эха</h1>
    <p data-i18n="boot">Открываем обсерваторию…</p>
    <div class="boot-bar" aria-hidden="true"><i id="bootFill"></i></div>
  </div>

  <main id="app" class="hidden" aria-label="Атлас Эха">
    <header class="topbar">
      <button id="btnChapter" class="chapter-chip" type="button" aria-haspopup="dialog">
        <span class="chapter-kicker" data-i18n="chapter">Глава</span>
        <strong id="chapterName">Тишина</strong>
      </button>
      <div class="top-title" aria-live="polite">
        <span id="fieldDay">Ночное окно</span>
        <strong id="fieldCount">0 записей</strong>
      </div>
      <button id="btnMenu" class="menu-btn" type="button" data-i18n-aria="menu" aria-label="Меню" aria-haspopup="dialog">
        <span></span><span></span><span></span>
      </button>
    </header>

    <section class="observatory" aria-label="Ночное небо">
      <button id="btnBrief" class="observation-brief" type="button" aria-haspopup="dialog">
        <span class="brief-eyebrow" id="briefEyebrow">Наблюдение</span>
        <strong id="briefTitle">Слушайте небо</strong>
        <span id="briefMeta">Выберите один сигнал</span>
        <span id="briefLetter" class="brief-letter" aria-live="polite"></span>
        <i class="brief-progress" aria-hidden="true"><b id="briefFill"></b></i>
      </button>

      <div id="sky" class="sky" role="group" data-i18n-aria="skyAria" aria-label="Поле наблюдения">
        <div class="sky-grain" aria-hidden="true"></div>
        <svg id="threadSvg" class="thread-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
        <div id="signalLayer" class="signal-layer"></div>
        <button id="anomalyNode" class="anomaly-node hidden" type="button" data-i18n-aria="anomalyAria" aria-label="Аномалия" aria-haspopup="dialog">
          <span class="anomaly-image" aria-hidden="true"></span>
          <span class="anomaly-orbit" aria-hidden="true"></span>
        </button>
        <div id="fieldPrompt" class="field-prompt" aria-live="polite">Выберите сигнал и прислушайтесь.</div>
      </div>

      <div class="action-ribbon" role="group" data-i18n-aria="actionsAria" aria-label="Действия наблюдателя">
        <button id="actListen" class="field-action listen" type="button">
          <span class="action-icon" aria-hidden="true">◖</span>
          <span class="action-copy"><strong data-i18n="listen">Слушать</strong><small data-i18n="listenHint">раскрыть голос</small></span>
        </button>
        <button id="actConnect" class="field-action connect" type="button">
          <span class="action-icon" aria-hidden="true">⌇</span>
          <span class="action-copy"><strong data-i18n="connect">Связать</strong><small data-i18n="connectHint">провести нить</small></span>
        </button>
        <button id="actWitness" class="field-action witness" type="button">
          <span class="action-icon" aria-hidden="true">◉</span>
          <span class="action-copy"><strong data-i18n="witness">Свидетельствовать</strong><small data-i18n="witnessHint">завершить запись</small></span>
        </button>
      </div>
    </section>

    <nav class="atlas-dock" data-i18n-aria="primaryNav" aria-label="Навигация атласа">
      <button id="btnAtlas" type="button" aria-haspopup="dialog"><span class="dock-icon" aria-hidden="true">▤</span><span data-i18n="atlas">Атлас</span></button>
      <button id="btnLenses" type="button" aria-haspopup="dialog"><span class="dock-icon" aria-hidden="true">◌</span><span data-i18n="lenses">Линзы</span></button>
      <button id="btnEncounters" type="button" aria-haspopup="dialog"><span class="dock-icon" aria-hidden="true">↗</span><span data-i18n="encounters">Встречи</span></button>
    </nav>
  </main>

  <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-hidden="true">
    <div class="sheet-card" tabindex="-1">
      <div class="sheet-head">
        <div><span id="sheetKicker" class="sheet-kicker"></span><h2 id="sheetTitle">Атлас</h2></div>
        <button id="sheetClose" type="button" data-i18n="close">Закрыть</button>
      </div>
      <div id="sheetBody" class="sheet-body"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <div id="ceremony" class="ceremony hidden" role="dialog" aria-modal="true" aria-labelledby="ceremonyTitle" aria-hidden="true">
    <div class="ceremony-burst" aria-hidden="true"></div>
    <div class="ceremony-card">
      <p class="ceremony-kicker" id="ceremonyKicker">Коллапс</p>
      <h2 id="ceremonyTitle">Ядро переродилось</h2>
      <p id="ceremonyText"></p>
      <button id="ceremonyClose" type="button">Продолжить</button>
    </div>
  </div>

  <script>
    window.GP_PROJECT_ID = '29882';
    window.GP_PUBLIC_TOKEN = 'L0vgwVfApwWg5WnJ5631bQiIn0S1eZ7o';
  </script>
  <script src="js/i18n.js"></script>
  <script src="js/gp-bridge.js"></script>
  <script src="js/audio-engine.js"></script>
  <script src="js/game.js"></script>
  <script>
    (function loadGP() {
      var id = window.GP_PROJECT_ID;
      var token = window.GP_PUBLIC_TOKEN;
      if (!id || id === 'YOUR_PROJECT_ID') return;
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://gamepush.com/sdk/game-score.js?projectId=' +
        encodeURIComponent(id) + '&publicToken=' + encodeURIComponent(token) +
        '&callback=onGPInit';
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
